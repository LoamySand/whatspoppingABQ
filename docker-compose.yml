# docker-compose.yml -- whatspoppingABQ production stack (SCRUM-23)
#
# All three app-role containers (prefect-server, prefect-flows) come from the
# SAME image built from the repo's Dockerfile (SCRUM-22) -- one image, one
# project, per Lane's call. Roles are just different `command:` overrides.
#
# NOT included yet:
#   - dashboard service: currently deployed on Streamlit Community Cloud
#     (share.streamlit.io pulls the repo directly -- this compose file never
#     runs it). Add a service here only once SCRUM-8 actually migrates the
#     dashboard off Streamlit Cloud onto self-hosted infra.
#   - nginx: intentionally left out of this file. It'll live in its own
#     compose file / service definition in SCRUM-24-26 ("Go self-hosted").
#     The `whatspoppingabq-net` network below is created now specifically so
#     nginx can join it later without any changes to the services here.
#
# Note on the DB: this stands up a self-hosted Postgres container, but the
# app's .env still points at Supabase until the actual cutover (SCRUM-27-31).
# Getting the container right now, ahead of the cutover, means SCRUM-27+ is
# "flip DB_HOST" rather than "also figure out Docker."
#
# LOCAL_DB_* vs DB_*: intentionally separate variable names. DB_USER/
# DB_PASSWORD/DB_NAME are the app's Supabase credentials (Supabase's pooler
# username looks like postgres.<project-ref>, not a plain username). Reusing
# those to bootstrap this container's own postgres role was the original
# bug here -- it tried to create a role literally named postgres.<project-ref>,
# which doesn't match what the schema dump's `OWNER TO postgres` expects,
# and broke the healthcheck too (pg_isready defaults its target database to
# the username when none is given). LOCAL_DB_* are new, separate values for
# this container specifically -- add them to .env (see .env.example).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: ${LOCAL_DB_NAME:-event_analytics}
    ports:
      # Exposed on host for direct psql access during migration/testing.
      # Revisit whether this should stay exposed once nginx/firewall rules
      # are in place on the Pi (SCRUM-24-26).
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs first (filename order): creates a separate `prefect` database
      # for Prefect's own orchestration backend, kept apart from app data.
      - ./database/schema/docker-init/00_create_prefect_db.sql:/docker-entrypoint-initdb.d/00_create_prefect_db.sql:ro
      # App-schema-qualified init script (see database/schema/docker-init/
      # for why this isn't the raw dump at database/schema/event_analytics_schema.sql).
      # Only runs on first container creation against an empty data volume --
      # rerun `docker compose down -v` if you need to force re-init.
      - ./database/schema/docker-init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-postgres} -d ${LOCAL_DB_NAME:-event_analytics}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - whatspoppingabq-net

  prefect-server:
    build: .
    image: whatspoppingabq:latest
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_UI_API_URL: http://10.0.0.90:4200/api
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://${LOCAL_DB_USER:-postgres}:${LOCAL_DB_PASSWORD}@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whatspoppingabq-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prefect-flows:
    build: .
    image: whatspoppingabq:latest
    restart: unless-stopped
    command: python run_prefect_flows.py
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy   # was: service_started
      postgres:
        condition: service_healthy
    networks:
      - whatspoppingabq-net
networks:
  whatspoppingabq-net:
    driver: bridge

volumes:
  postgres_data: